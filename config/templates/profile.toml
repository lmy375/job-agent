# profile 模板 —— 一个 profile = 一个用户或一种求职场景
#
# `job profile new <名字>` 会把 config/templates/ 整份拷成 profiles/<名字>/，
# 这个文件就变成 profiles/<名字>/profile.toml。
#
# 这里只放**随人而变**的东西：简历、求职偏好、搜索条件与关键词、打分门槛与信号表。
# 跟人无关的东西（猎聘账号密钥、限速、模型接入点、Web 端口、日志）在全局的
# config/config.toml 里——两个文件的段名互不重叠，放错了会当场报错并告诉你该放哪。
#
# 本文件里的相对路径都**相对于这个 profile 的目录**，
# 所以 profiles/a 和 profiles/b 的 data/jobs.db 是两个库，互不可见。

# ---------------------------------------------------------------- 求职者
[profile]
# 求职者信息。resume / preferences 是 /job-match 挑岗位、写投递口径时的输入，
# 程序不解析内容，自由格式 Markdown 即可（`/job-init` skill 会引导你写）
name = "你的名字"
# 用全局 [liepin.accounts.*] 里的哪个账号搜索与投递。
# profile 换成另一个人时，换的就是这一行
account = "default"
resume = "resume.md"
preferences = "preferences.md"

# LLM 打分（`job llm-score`）两个维度的提示词。**这两个文件默认不存在**，
# 那表示用 src 里的内置方法论——想改就在 profile 目录下建同名文件，
# 或者直接在 Web 的「配置」页里改（保存时会替你建）。整段替换，不是追加。
#   score_appeal.md  维度一：从求职者角度，这份工作本身值多少分
#   score_fit.md     维度二：从招聘方角度，你拿到它的概率有多大
# score_appeal_prompt = "score_appeal.md"
# score_fit_prompt = "score_fit.md"

# ---------------------------------------------------------------- 搜索
[search]
address = "北京"          # 工作地点，服务端模糊匹配
salary_kind = "年薪"      # 年薪 / 月薪；留空表示不按薪资过滤
salary_floor = 1000000    # 薪资下限，单位为元。年薪 100 万 = 1000000
# salary_cap = 3000000    # 薪资上限，单位为元，可省略
# edu_level = "本科"       # 学历要求，取值见 README
# work_experience = "5-10年"
max_pages = 6             # 每个关键词翻几页；服务端硬上限 6 页（= 120 条）

# 搜索关键词，**数组顺序 = 优先级**。因为按 jobId 去重，
# 每条职位记到的 searchKeyword 就是「最先命中它的那个词」，
# 所以把最想要的方向放最前面。
#
# 刻意是一个扁平数组，不按方向分组——一个 profile 就是一个方向 / 一个人，
# 想同时跑两条线就开两个 profile（job profile new web3）。
# 临时只搜某几个词：job search -k "AI Agent" -k 大模型
# 不想再搜的词直接注释掉，留着能看出库里存量数据是怎么来的。
keywords = [
  "AI Agent",
  "大模型",
  "AI应用",
  "AI平台",
  "LLM",
  "AI工程",
  # "区块链", "智能合约", "Web3", "Solidity",
  # "后端架构师", "后端技术专家", "技术专家",
]

# ---------------------------------------------------------------- 存储
[storage]
database = "data/jobs.db"

# ---------------------------------------------------------------- 打分
# ============================================================================
# [score] 是**匹配信号表**：整段都是「你想要什么」，不是通用规则。
# 它曾经是独立的 match.toml，合进来了——拆成两个文件唯一的效果是
# 多一处要同步、多一条要解析的路径。
#
# 下面这份示例是给「AI 应用 / Agent 工程方向、想带团队、不想做纯算法和纯安全」
# 的人写的。**如果你的方向不同，整份重写，不要微调。**
#     · 做算法训练的人：把「算法训练岗」那条的 weight 从 -12 改成 +12
#     · 做安全的人：把「纯安全岗」那条改成正信号，并改 [score.require] 的 pattern
#     · 做 Web3 的人：[score.require] 换成区块链词，AI 相关信号降权
#
# 不知道该怎么填？在 Claude Code 里跑 `/job-init`，它会问你方向、
# 明确不看什么、技术栈，然后生成这张表。
# ============================================================================
#
# 正则写法：**一律用单引号**（TOML 字面量字符串，不处理转义），
# 所以 \b、\s、\d 直接写就行。
# 千万别用双引号写 "\bagent\b"——TOML 里 \b 是「退格符」转义，
# 会静默变成 <退格>agent<退格>：正则编译得过、一条也匹配不上、排名看着正常但全错。
# （真写错了读配置时就会报错，但不如一开始就用单引号。）
#
# 英文词的单词边界必须裹一层 (?a:...) —— 这是第二个同样安静的坑。
# Python 的 \b 是「\w 与非 \w 的交界」，而中文字符**算 \w**，
# 于是 '\bai\b' 匹配不上「AI应用」、'\bagent\b' 匹配不上「Agent开发」「多Agent协作」：
# 中文 JD 里英文缩写紧贴汉字是常态，等于这条信号常年不命中。
# (?a:...) 让括号内的 \b / \w 只按 ASCII 算，汉字就重新成了边界。
# 只裹英文缩写那一段，别整条裹——\s 保持 Unicode 语义才能吃全角空格。
#
# 打分怎么算：
#   1. 每条 [[score.signals]] 的正则在「职位名 + JD 正文」里搜一次，命中就加 weight
#   2. 命中位置在**职位名**里时，weight × title_multiplier（职位名更能代表岗位本质）
#   3. 同一条信号在标题和正文都命中时只算标题那份，不重复累加
#   4. 最后按 [score.require] 判一次「是否完全不对口」
#
# 分数只用来**分诊**（把几百条砍到几十条），不代表结论。
# 「该不该投」要读 JD——跑 `/job-match`。

[score]
# 只看薪资**上限**不低于这个数的岗位（万元/年）。留空表示不过滤。
# **全系统薪资一律按税前填写**（JD 标的就是税前），不做税后换算。
# 按上限而不是下限过滤：上限才代表「这家最多能给到多少」，
# 按下限过滤会误杀「50-80k·20薪」这类实际能谈上去的岗位。
# salary_floor_wan = 135.0

# 职位名命中时的权重倍数。调到 1.0 表示「标题和正文一样重要」，
# 实测这样会让一堆「JD 里顺口提了一句 Agent」的岗位挤进前列，不建议。
title_multiplier = 2.0

[score.require]
# 职位名与 JD 正文里**都**找不到这些词，说明连赛道都不对（想投 AI 却是个纯 CRUD 后端），
# 直接扣 penalty 压到排序末尾。
#
# 为什么需要这道闸：光靠 [[score.signals]] 里的负信号，永远穷举不完所有不想要的方向。
# 正向要求「必须提到我的赛道」比反向排除「不能是 XX 岗」可靠得多。
pattern = '(?a:\bagent\b|\bllm\b|\bai\b)|智能体|大模型|人工智能|生成式|agentic'
penalty = -20.0

# ============================================================ 正信号
# 权重怎么定：把「这条命中了，我会不会因此想点开看看」当标准。
#   10 = 看到就想投      6-8 = 明显加分
#   3-5 = 技术栈对得上    1-2 = 有一点关系

[[score.signals]]
name = "AI Agent / 智能体"
weight = 10
pattern = '(?a:\bagent\b)|智能体|agentic|多智能体'

[[score.signals]]
name = "MCP 协议"
weight = 9
pattern = '(?a:\bmcp\b)|model\s+context\s+protocol'

[[score.signals]]
name = "大模型应用落地"
weight = 8
pattern = '大模型应用|llm\s*应用|ai\s*应用|大模型落地|应用落地'

[[score.signals]]
name = "AI Coding"
weight = 8
pattern = 'ai\s*cod|代码生成|copilot|cursor|claude\s*code|编程助手|研发提效'

[[score.signals]]
name = "AI 平台 / 网关"
weight = 7
pattern = 'ai\s*(平台|中台)|大模型平台|智能体平台|agent\s*平台|模型网关|llm\s*proxy|推理网关'

[[score.signals]]
name = "Tech Lead / 带团队"
weight = 6
pattern = 'tech\s*lead|技术负责人|带(领)?团队|团队管理|研发负责人|团队负责人'

[[score.signals]]
name = "RAG / 知识库"
weight = 6
pattern = '(?a:\brag\b)|检索增强|知识库|向量(检索|数据库)|语义检索'

[[score.signals]]
name = "上下文工程 / 提示工程"
weight = 6
pattern = 'prompt|提示词|上下文工程|context\s*engineering|工作流编排|workflow\s*编排|harness'

[[score.signals]]
name = "工具调用 / Function Calling"
weight = 5
pattern = 'function\s*call|tool\s*(call|use)|工具调用|插件体系'

[[score.signals]]
name = "评测 / 可观测"
weight = 5
pattern = 'langfuse|langsmith|可观测|评测体系|(?a:\beval\b)|评估体系'

[[score.signals]]
name = "Python"
weight = 5
pattern = '(?a:\bpython\b)'

[[score.signals]]
name = "从 0 到 1"
weight = 4
pattern = '从\s*0\s*到\s*1|0-1|从零(搭建|开始)|搭建体系'

[[score.signals]]
name = "FastAPI"
weight = 4
pattern = '(?a:\bfastapi\b)'

[[score.signals]]
name = "Electron / 桌面端"
weight = 4
pattern = '(?a:\belectron\b)|桌面客户端|桌面端'

[[score.signals]]
name = "Agent 框架"
weight = 3
pattern = '(?a:\bagno\b)|langchain|langgraph|llamaindex|dify|autogen|crewai|openai\s*agents'

[[score.signals]]
name = "前端 / 全栈"
weight = 3
pattern = 'typescript|(?a:\breact\b)|前端|全栈'

[[score.signals]]
name = "移动端 / 跨端"
weight = 3
pattern = 'react\s*native|跨端'

[[score.signals]]
name = "Web3 背景可复用"
weight = 3
pattern = '区块链|web3|加密货币|钱包|链上'

# ============================================================ 负信号
# 这些是**明确不想要**的方向。写在这里而不是靠 [score.require] 兜，
# 是因为它们往往同时带着强正信号（「大模型预训练」里有「大模型」），
# 不显式扣分会排到很前面。
#
# 正则较长，但坚持一条一行：TOML 的多行字符串（三引号）为了拼接得用行末续行符，
# 很容易多一个少一个空格，而正则里的空格是有意义的。

[[score.signals]]
name = "非研发职能"
weight = -16
pattern = '(?a:\bceo\b|\bcfo\b|\bcmo\b|\bcho\b)|hrvp|首席(执行|财务|营销|运营)|总裁|总经理|事业部|市场(经理|营销|总监)|销售|解决方案(总监|架构)|售前|咨询顾问|对外事务|战略变革|投融资|人力资源|财务|法务|品牌'

[[score.signals]]
name = "商业化 / BD / 增长"
weight = -15
pattern = '商业化|业务拓展|客户成功|渠道(经理|总监|运营)|增长负责人|投资(经理|总监)|运营(经理|总监|负责人)'

[[score.signals]]
name = "硬件 / 具身 / 自驾"
weight = -14
pattern = '芯片|(?a:\beda\b|\bvla\b)|流片|具身|机器人本体|自动驾驶|智能驾驶|感知算法|激光雷达|车规|整车|硬件研发|嵌入式|穿戴|ar眼镜'

[[score.signals]]
name = "纯安全岗"
weight = -14
pattern = '渗透测试|等级保护|安全合规|甲方安全|安全运营|(?a:\bsoc\b)|态势感知|安全审计岗|漏洞挖掘|逆向分析|红蓝对抗|数据安全治理|安全产品经理'

[[score.signals]]
name = "算法训练岗"
weight = -12
pattern = '预训练|后训练|强化学习|模型训练|训练框架|分布式训练|算子|(?a:\brlhf\b|\bcuda\b)|推理(加速|优化)|量化压缩|蒸馏|megatron|deepspeed|推荐算法|搜索算法|广告算法|排序模型|召回'

[[score.signals]]
name = "内容 / 数字人"
weight = -12
pattern = '视频内容|内容(运营|生产|负责人)|数字人|虚拟人|直播'

[[score.signals]]
name = "纯产品经理岗"
weight = -8
pattern = '产品经理|产品总监|产品负责人'

[[score.signals]]
name = "数据工程 / 数仓"
weight = -8
pattern = '数据仓库|数仓|(?a:\betl\b)|flink|spark\s*streaming|iceberg|paimon|clickhouse|doris|starrocks|olap|特征平台|feature\s*store'

[[score.signals]]
name = "传统运维"
weight = -6
pattern = '运维|(?a:\bsre\b|\bdba\b)|中间件运维|集群运维|报表开发'
