[project]
name = "job-agent"
version = "1.0.0"
description = "猎聘职位采集、分析、投递与市场报告工具（CLI + Web 管理台）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "requests>=2.32,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
job = "job_agent.cli:main"
job-agent = "job_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

# ---------------------------------------------------------------- 工具配置

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff 自有规则
]
ignore = [
    # 库表字段沿用猎聘接口的 camelCase，与抓包字段一一对应，比改成 snake_case 更好排查
    "N815",
    "N803",
    "N806",
    # 中文注释里的全角标点会被误判为 ambiguous unicode
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 词典与规则表是大段数据，行内注释紧跟正则，不做长度检查
"src/job_agent/core/analysis/rules.py" = ["E501"]
"src/job_agent/core/analysis/skills.py" = ["E501"]
"src/job_agent/core/report/styles.py" = ["E501"]
"src/job_agent/core/report/renderer.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
